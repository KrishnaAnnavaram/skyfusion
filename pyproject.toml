[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyfusion"
version = "0.1.0"
description = "Fuse ground stations and NASA POWER data for next-hour LSTM weather forecasts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "pydantic>=2.5"]

[project.optional-dependencies]
# The LSTM direct multi-horizon model.
lstm = ["torch>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
skyfusion = "skyfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
